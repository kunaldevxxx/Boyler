syntax = "proto3";

package daemon;

option go_package = "boyler/internal/daemon/infrastructure/inbound/api/grpc/gen";

service ContainerService {
    rpc CreateContainer(CreateRequest) returns (CreateResponse);

    rpc StartContainer(StartRequest) returns (StartResponse);

    rpc StopContainer(StopRequest) returns (StopResponse);

    rpc RemoveContainer(RemoveRequest) returns (RemoveResponse);

    rpc InspectContainer(InspectRequest) returns (InspectResponse);

    rpc AttachContainer(stream AttachRequest) returns (stream AttachResponse);

    rpc ContainersList(PsRequest) returns (PsResponse);
}

service ImageService {
  rpc PullImage (PullImageRequest) returns (stream PullImageEvent);
  
  rpc RemoveImage (RemoveImageRequest) returns (RemoveImageResponse);

  rpc ListImages (ListImagesRequest) returns (ListImagesResponse);

  rpc InspectImage (InspectImageRequest) returns (ImageSummary);

  rpc PruneImages (PruneImagesRequest) returns (PruneImagesResponse);
}

// DaemonInspectionService exposes read-only daemon and host diagnostics.
service DaemonInspectionService {
  rpc SystemInfo(SystemInfoRequest) returns (SystemInfoResponse);
  rpc Doctor(DoctorRequest) returns (DoctorResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
}

message SystemInfoRequest {}

message SystemInfoResponse {
  string os = 1;
  string architecture = 2;
  string kernel = 3;
  string hostname = 4;
  string go_version = 5;
  string cgroup_version = 6;
  repeated string cgroup_controllers = 7;
  bool overlay_fs = 8;
  bool root = 9;
  bool ipv4_forwarding = 10;
  string runtime_path = 11;
  string images_path = 12;
  string containers_path = 13;
  string daemon_started_at = 14;
  int64 daemon_uptime_seconds = 15;
  int32 daemon_pid = 16;
}

message DoctorRequest {}

enum DiagnosticStatus {
  DIAGNOSTIC_STATUS_UNSPECIFIED = 0;
  DIAGNOSTIC_STATUS_PASS = 1;
  DIAGNOSTIC_STATUS_WARNING = 2;
  DIAGNOSTIC_STATUS_FAIL = 3;
}

message DiagnosticCheck {
  string code = 1;
  string component = 2;
  string name = 3;
  DiagnosticStatus status = 4;
  string detail = 5;
  string hint = 6;
}

message DoctorResponse {
  bool healthy = 1;
  repeated DiagnosticCheck checks = 2;
}

message VersionRequest {}

message VersionResponse {
  string version = 1;
  string commit = 2;
  string build_date = 3;
  string go_version = 4;
  string os = 5;
  string architecture = 6;
  string api_version = 7;
  string state_version = 8;
  string runtime_version = 9;
}

message CreateRequest {
    string name = 1;
    string image_identity = 2;
    repeated string args = 3;
    map<string, string> env = 4;
    ResourceLimits resources = 5;
}
message CreateResponse {
    string container_id = 1;
    string status = 2;
}

message StartRequest {
  string container_id = 1;
}

message StartResponse {
  string container_id = 1;
  int32 pid = 2;
}

message StopRequest {
  string container_id = 1;
}

message StopResponse {
  string container_id = 1;
}

message ResourceLimits {
  MemoryRestriction memory = 1;
  CPURestriction cpu = 2;
}

message MemoryRestriction {
  int64 max = 1;
  bool exist = 2;
}

message CPURestriction {
  uint64 weight = 1;
  int64 quota = 2;
  uint64 period = 3;
  string cpus = 4;
  string mems = 5;
}

message RemoveRequest {
    string container_id = 1;
}

message RemoveResponse {
    string container_id = 1;
}

message InspectRequest {
    string container_id = 1;
}

message InspectResponse {
  string container_id = 1;
  int32 pid = 2;
  string image_id = 3;
  string created_at = 4;
  string started_at = 5;
  string status = 6;
  string hostname = 7;
  repeated string env = 8;
  repeated string args = 9;
  ResourceLimits resources = 10;
}

message PullImageRequest {
    string image_identity = 1;
}

message PullImageEvent {
    string status = 1;
    string layid = 2;
    int64 progress = 3;
    int64 total = 4;
}

message RemoveImageRequest {
    string image_id = 1;
    repeated string image_references = 2;
    bool force = 3;
}

message RemoveImageResponse {
    string status = 1;
    repeated RemovedImage images = 2;
    repeated ImageOperationError failures = 3;
}

message RemovedImage {
    string reference = 1;
    string digest = 2;
}

message ImageOperationError {
    string reference = 1;
    string error = 2;
}

message ListImagesRequest {}

message ListImagesResponse {
    repeated ImageSummary images = 1;
}

message ImageSummary {
    string id = 1;
    string repo_tag = 2;
    int64 size = 3;
    string created_at = 4;
    string reference = 5;
    string digest = 6;
    string rootfs_digest = 7;
    repeated string layers = 8;
}

message InspectImageRequest {
    string image_reference = 1;
}

message PruneImagesRequest {
    bool all = 1;
    bool dry_run = 2;
}

message PruneImagesResponse {
    repeated string deleted_references = 1;
    repeated string deleted_manifests = 2;
    repeated string deleted_rootfs = 3;
    repeated string deleted_layers = 4;
    int64 reclaimed_bytes = 5;
    bool dry_run = 6;
    repeated string quarantined_references = 7;
}

message AttachRequest {
    oneof payload {
        AttachInit init = 1;
        bytes stdin = 2;
        TerminalSize resize = 3;
    }
}

message AttachInit {
    string container_id = 1;
}

message TerminalSize {
    uint32 width = 1;
    uint32 height = 2;
}

message AttachResponse {
    oneof payload {
        bytes stdout = 1;
        bytes stderr = 2;
        ExitStatus exit = 3;
    }
}

message ExitStatus {
    int32 code = 1;
}

message PsResponse {
  repeated ContainerListItem containers = 1;
}

message ContainerListItem {
  string container_id = 1;
  string image = 2;
  string command = 3;
  string created = 4;
  string status = 5;
  string name = 7;
}

message PsRequest {
}
